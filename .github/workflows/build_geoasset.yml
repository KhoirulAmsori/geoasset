name: Build GEO Asset
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Tweaks global untuk meningkatkan ketahanan Git terhadap network timeout (Exit Code 28)
      - name: Setup git with token & network tweaks
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Setup environment & download asset
        run: |
          export TZ="Asia/Jakarta"
          sudo locale-gen id_ID.UTF-8
          echo "BUILDTIME=$(LC_TIME=id_ID.UTF-8 date '+%a, %d/%m/%Y - %H:%M:%S')" >> $GITHUB_ENV
          echo "OISD_SMALL=https://small.oisd.nl/dnsmasq" >> $GITHUB_ENV
          echo "OISD_NSFW=https://nsfw.oisd.nl/dnsmasq" >> $GITHUB_ENV
          echo "OISD_NSFW_SMALL=https://nsfw-small.oisd.nl/dnsmasq" >> $GITHUB_ENV
          
          # Folder untuk penerbitan
          mkdir -p Publish
          
          # Kloning repo ke geoip-build/asset
          for i in {1..3}; do git clone --depth 1 -b asset https://github.com/${{ github.repository }} geoip-build/asset && break || sleep 15; done

      - name: Prepare Go cache folder
        run: mkdir -p /tmp/go-build/pkg/mod

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            ./geoip-build/go.sum
            ./geosite-build/go.sum
        env:
          GOPATH: /tmp/go-build

      - name: Build GEOIP
        run: |
          cd geoip-build/asset/GEO
          
          # Ekstrak semua aset
          for file in *.{tar.gz,zip}; do
            [[ $file == *.tar.gz ]] && tar -xvzf "$file"
            [[ $file == *.zip ]] && unzip "$file"
          done
          
          cd ../../
          mkdir -p geolite2
          
          # Pindahkah aset terunduh ke geolite2
          cp asset/GEO/GeoLite2-Country_*/*.mmdb geolite2/
          cp asset/GEO/GeoLite2-ASN_*/*.mmdb geolite2/
          cp asset/GEO/GeoLite2-ASN-CSV_*/*.csv geolite2/
          cp asset/GEO/GeoLite2-Country-CSV_*/*.csv geolite2/
          cp asset/GEO/GeoLite2-Country-CSV_*/{GeoLite2-Country-Blocks-IPv4*,GeoLite2-Country-Locations-en}.csv geolite2/
          
          # Salin aset untuk diterbitkan. Nama harus ASN.mmdb karena
          # Path.ASN() di mihomo hanya mengenali nama itu.
          cp geolite2/GeoLite2-ASN.mmdb ../Publish/ASN.mmdb
          
          # Daftar peserta OpenIXP/IIX: nice.rsc -> CIDR murni untuk input 'nice'
          curl -L --retry 5 --retry-delay 10 --max-time 300 -s -o nice.rsc http://ixp.mikrotik.co.id/download/nice.rsc
          grep -oP 'address="\K[0-9./]+' nice.rsc | grep '/' | sort -u > nice.list
          [ -s nice.list ] || { echo "nice.list kosong, unduhan nice.rsc gagal"; exit 1; }
          wc -l nice.list

          # Jalankan pembangunan
          go mod tidy
          go build ./
          ./geoip convert -c ./config.json

      - name: Build GEOSITE
        run: |
          # Kloning ke domain-list-community
          for i in {1..3}; do git clone --depth 1 https://github.com/v2fly/domain-list-community && break || sleep 15; done
          
          cd geosite-build
          
          # Pengecualian domain di oisd-small dan oisd-nsfw-small 
          curl -sSL $OISD_SMALL | perl -ne 'if(/^server=\/([^\/]+)\//){$d=$1;if($d!~/^(googlesyndication\.com|pagead2\.googlesyndication\.com|gambar123\.com)$/){print "$d\n"}}' > ../domain-list-community/data/oisd-small

          exclude=$(paste -sd'|' exclude_list.txt)
          curl -sSL $OISD_NSFW_SMALL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' | grep -vE "$exclude" > ../domain-list-community/data/oisd-nsfw-small
          cp raven_nsfw ../domain-list-community/data/raven_nsfw
          
          # Ganti list cn dengan stub verifikasi. mihomo hanya mengecek entry
          # "cn" ada di GeoSite.dat, isinya tidak diperiksa, jadi daftar CN
          # penuh tidak perlu ikut diterbitkan.
          cp cn ../domain-list-community/data/cn
          
          # Jalankan pembangunan
          go mod tidy
          go run ./ --datapath=../domain-list-community/data --excludelists='*-cn'

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.BUILDTIME }}
          tag: latest
          file_glob: true
          overwrite: true
          file: Publish/*
          body: |
            ## Build Date: ${{ env.BUILDTIME }} ##

            | Berkas | Dipakai saat |
            | --- | --- |
            | `geoip.metadb` | mode GeoIP default mihomo (`geodata-mode: false`), format Meta-geoip0 |
            | `GeoIP.dat` | mode GeoIP `geodata-mode: true` |
            | `GeoSite.dat` | aturan `GEOSITE` |
            | `ASN.mmdb` | aturan `IPASN` |
            | `nice.mrs` | rule-provider mihomo (`format: mrs`, `behavior: ipcidr`), daftar peserta OpenIXP/IIX |

            List `cn` di `GeoSite.dat` (3 domain) dan entri `CN` di `GeoIP.dat` plus `geoip.metadb` (2 CIDR AliDNS) sengaja cuma stub. mihomo memverifikasi geodata dengan memuat list `cn` dan hanya mengecek entry itu ada, isinya tidak diperiksa, jadi stub cukup untuk lolos verifikasi tanpa menerbitkan daftar CN lengkap.
            Karena itu `GEOSITE,CN` dan `GEOIP,CN` tidak layak dipakai untuk routing. List China lain (`geolocation-cn`, `tld-cn`, `aws-cn`, `category-*-cn`)
            tidak diterbitkan sama sekali.

            Contoh geo-url:

            ```yaml
            geox-url:
              geoip: "https://github.com/${{ github.repository }}/releases/download/latest/GeoIP.dat"
              geosite: "https://github.com/${{ github.repository }}/releases/download/latest/GeoSite.dat"
              mmdb: "https://github.com/${{ github.repository }}/releases/download/latest/geoip.metadb"
              asn: "https://github.com/${{ github.repository }}/releases/download/latest/ASN.mmdb"
            ```

            Contoh rule-provider:

            ```yaml
            rule-providers:
              OpenIXP-IIX:
                type: http
                url: "https://github.com/${{ github.repository }}/releases/download/latest/nice.mrs"
                format: mrs
                behavior: ipcidr
                interval: 86400
                path: "./rule_provider/nice.mrs"
            ```
