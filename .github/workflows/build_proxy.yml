name: Build Proxy List

on:
  schedule:
    - cron: "0 17 * * *"
#  push:
#    branches:
#    - dev
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable Debuging?"
        required: false
        default: "false"
        type: boolean
  repository_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      EnableDebug: ${{ github.event.inputs.debug || 'false' }}
      GeoLiteAsnDbPath: Asset/GeoLite2-ASN.mmdb
      GeoLiteCountryDbPath: Asset/GeoLite2-Country.mmdb
      MaxThreadCount: 512
      Timeout: 3000
      MinActiveProxies: 10
      MaxProxiesPerCountry: 0
      RetryCount: 5
      SourcesFile: Asset/sources.txt
      PreviousListFile: GEO/Proxy/list.txt
      TestUrl: "https://www.youtube.com/generate_204"
      ExpectedStatus: "200-204"
      ConcurrentDNS: 32

    steps:
      - name: Set variables
        run: |
          export TZ="Asia/Jakarta"
          sudo locale-gen id_ID.UTF-8
          echo "BUILDTIME=$(LC_TIME=id_ID.UTF-8 date '+%a, %d/%m/%Y - %H:%M:%S')" >> $GITHUB_ENV

      - name: Setup git with token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          path: source

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            ./source/proxy-build/go.mod
            ./source/proxy-build/go.sum

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: source/proxy-collector/requirements.txt

      - name: Collect proxy configs from Telegram
        env:
          # Scoped to this step: the collector's Timeout is seconds, while
          # proxy-build's job-level Timeout is milliseconds.
          CollectedFile: collected.txt
          ChannelsStateFile: channels.json
          TelegramDepth: 3
          Concurrency: 8
          Timeout: 15
          MaxNewChannels: 50
          MinCollected: 0
          RetireAfter: 10
          RetryAfter: 30
          # Collector CWD is source/proxy-collector; point the flag at the path
          # proxy-build's push guard checks so a low-yield run suppresses push.
          SkipPushFlag: ../proxy-build/skip_push.flag
        run: |
          cd source/proxy-collector
          git clone --depth 1 -b asset https://github.com/${{ github.repository }} ASSET 2>/dev/null || true
          if [ -f ASSET/Proxy/channels.json ]; then
            cp ASSET/Proxy/channels.json channels.json
          fi
          pip install -r requirements.txt
          python main.py
          cp collected.txt ../proxy-build/collected.txt

      - name: Build proxy list
        env:
          # Scoped to this step: proxy-build's Timeout is milliseconds, while
          # the collector step's Timeout is seconds. Without this the collector
          # value (15) would be inherited as a 15ms dial timeout.
          Timeout: 3000
        run: |
          cd source/proxy-build
          git clone --depth 1 -b asset https://github.com/${{ github.repository }} GEO
          for file in GEO/GEO/*.tar.gz; do
            tar -xzf "$file" --wildcards --transform='s:.*/::' -C Asset '*.mmdb'
          done

          # Feed collector output into proxy-build as a local source
          if [ -s collected.txt ]; then
            grep -qxF collected.txt Asset/sources.txt || echo collected.txt >> Asset/sources.txt
          fi

          # Run Go Build
          go build -v -o nodechecker .

          # Run checker
          ./nodechecker

      - name: Prepare local repo for 'asset' branch
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        env:
          GH_TOKEN: ${{ secrets.AUTH_PAT }}
        run: |
          rm -rf asset
          mkdir -p asset
          cd asset
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://${{ github.actor }}:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin asset; then
            git fetch origin asset
            git checkout -b asset origin/asset
          else
            git checkout --orphan asset
          fi
          cd ..

      - name: Backup and copy build results
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        run: |
          BACKUP_DATE=$(TZ=Asia/Jakarta date '+%Y%m%d')
          BACKUP_DIR=asset/Backup

          if [ -f source/proxy-build/list.txt ]; then
            mkdir -p $BACKUP_DIR
            cp source/proxy-build/list.txt $BACKUP_DIR/${BACKUP_DATE}_list.txt

            # Simpan hanya 30 backup terbaru
            ls -1t $BACKUP_DIR/*_list.txt | tail -n +31 | xargs -r rm -f
          else
            echo "No existing list.txt to backup"
          fi

          mkdir -p asset/Proxy
          cp source/proxy-build/list.txt asset/Proxy/

          if [ -f source/proxy-collector/channels.json ]; then
            cp source/proxy-collector/channels.json asset/Proxy/channels.json
          fi

      - name: Commit & push asset
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        run: |
          cd asset
          git add Proxy Backup
          git commit -m "Update proxy list on ${{ env.BUILDTIME }}" || echo "No changes"
          git push -u origin asset
