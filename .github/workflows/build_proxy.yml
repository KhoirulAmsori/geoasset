name: Build Proxy List

on:
  schedule:
    - cron: "0 17 * * *"
#  push:
#    branches:
#    - dev
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable Debuging?"
        required: false
        default: "false"
        type: boolean
  repository_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      EnableDebug: ${{ github.event.inputs.debug || 'false' }}
      GeoLiteAsnDbPath: Asset/GeoLite2-ASN.mmdb
      GeoLiteCountryDbPath: Asset/GeoLite2-Country.mmdb
      MaxThreadCount: 512
      Timeout: 3000
      MinActiveProxies: 10
      MaxProxiesPerCountry: 0
      RetryCount: 5
      SourcesFile: Asset/sources.txt
      PreviousListFile: GEO/Proxy/list.txt
      TestUrl: "https://www.youtube.com/generate_204"
      ExpectedStatus: "200-204"
      ConcurrentDNS: 32

    steps:
      - name: Set variables
        run: |
          export TZ="Asia/Jakarta"
          sudo locale-gen id_ID.UTF-8
          echo "BUILDTIME=$(LC_TIME=id_ID.UTF-8 date '+%a, %d/%m/%Y - %H:%M:%S')" >> $GITHUB_ENV

      - name: Setup git with token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          path: source

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            ./source/proxy-build/go.mod
            ./source/proxy-build/go.sum

      - name: Build proxy list
        run: |
          cd source/proxy-build
          git clone --depth 1 -b asset https://github.com/${{ github.repository }} GEO
          for file in GEO/GEO/*.tar.gz; do
            tar -xzf "$file" --wildcards --transform='s:.*/::' -C Asset '*.mmdb'
          done

          # Run Go Build
          go build -v -o nodechecker .

          # Run checker
          ./nodechecker

      - name: Prepare local repo for 'asset' branch
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        env:
          GH_TOKEN: ${{ secrets.AUTH_PAT }}
        run: |
          rm -rf asset
          mkdir -p asset
          cd asset
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://${{ github.actor }}:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin asset; then
            git fetch origin asset
            git checkout -b asset origin/asset
          else
            git checkout --orphan asset
          fi
          cd ..

      - name: Backup and copy build results
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        run: |
          BACKUP_DATE=$(TZ=Asia/Jakarta date '+%Y%m%d')
          BACKUP_DIR=asset/Backup

          if [ -f source/proxy-build/list.txt ]; then
            mkdir -p $BACKUP_DIR
            cp source/proxy-build/list.txt $BACKUP_DIR/${BACKUP_DATE}_list.txt

            # Simpan hanya 30 backup terbaru
            ls -1t $BACKUP_DIR/*_list.txt | tail -n +31 | xargs -r rm -f
          else
            echo "No existing list.txt to backup"
          fi

          mkdir -p asset/Proxy
          cp source/proxy-build/list.txt asset/Proxy/

      - name: Commit & push asset
        if: ${{ !hashFiles('source/proxy-build/skip_push.flag') }}
        run: |
          cd asset
          git add Proxy Backup
          git commit -m "Update proxy list on ${{ env.BUILDTIME }}" || echo "No changes"
          git push -u origin asset
